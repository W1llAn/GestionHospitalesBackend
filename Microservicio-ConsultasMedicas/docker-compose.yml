version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-dev-con
    environment:
      MARIADB_ROOT_PASSWORD: 200232
      MARIADB_DATABASE: consultas
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  paciente-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paciente-grpc
    ports:
      - "7256:7256"
    depends_on:
      - mariadb

volumes:
  mariadb_data:
